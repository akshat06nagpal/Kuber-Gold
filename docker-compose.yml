services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      PRICE_MODE: ${PRICE_MODE:-mock}
      MOCK_PRICE_INR_PER_GRAM: ${MOCK_PRICE_INR_PER_GRAM:-12500.00}
      PRICE_URL: ${PRICE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      LLM_MODEL: ${LLM_MODEL:-gemini-2.0-flash}
      DB_PATH: /data/kuber.db
      LOG_PATH: /logs/app.jsonl
    volumes: ["./data:/data", "./logs:/logs"]
